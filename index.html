<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankzo Digital Services</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero" data-aos="fade-up">
        <h1>Ankzo Digital Services</h1>
        <p>Creative • Professional • Result-Driven Digital Solutions</p>
    </header>

    <section class="services">
        <h2 data-aos="fade">Our Services</h2>
        <div class="service-grid">
            <div class="card" data-aos="fade-in">
                <img src="icon1.png" class="soft-zoom" alt="Icon">
                <h3>UI / UX Design</h3>
            </div>
            <div class="card" data-aos="fade-in">
                <img src="icon2.png" class="soft-zoom" alt="Icon">
                <h3>Web Development</h3>
            </div>
        </div>
    </section>

    <footer class="contact-section" data-aos="slide-up">
        <div class="contact-card">
            <h2>Contact Us</h2>
            <button class="btn-gradient">Send Message</button>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>
</html>
